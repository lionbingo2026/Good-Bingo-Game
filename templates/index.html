<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Good Bingo Game</title>

<!-- Telegram Mini App -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Good Bingo Game CSS -->
<link rel="stylesheet" href="/static/style.css">

</head><body><div class="app"><!-- Header -->
<header class="header">
    <div class="logo">🎲</div>

    <h1>Good Bingo Game</h1>

    <p>Live 75-Ball Bingo</p>
</header>


<!-- Message -->
<div id="message" class="message"></div>


<!-- Game statistics -->
<section class="card">

    <div class="stats">

        <div class="stat">
            <strong id="players">0</strong>
            <span>Players</span>
        </div>

        <div class="stat">
            <strong id="cards">0</strong>
            <span>Cards</span>
        </div>

        <div class="stat">
            <strong id="pot">0 ETB</strong>
            <span>Prize Pool</span>
        </div>

    </div>

</section>


<!-- Game -->
<section class="card">

    <div id="gameStatus" class="status">
        Waiting for game...
    </div>


    <!-- Current number -->
    <div
        id="currentNumber"
        class="current-number"
    >
        —
    </div>


    <!-- Bingo card -->
    <div class="board-title">
        <strong>YOUR BINGO CARD</strong>
    </div>

    <div
        id="bingoBoard"
        class="bingo-board"
    ></div>

</section>


<!-- Controls -->
<section class="card">

    <div class="controls">

        <button
            id="joinButton"
            class="primary"
            onclick="joinGame()"
        >
            🎮 Join Game
        </button>


        <button
            id="bingoButton"
            class="primary"
            onclick="claimBingo()"
            disabled
        >
            🏆 BINGO!
        </button>


        <button
            class="secondary"
            onclick="refreshGame()"
        >
            🔄 Refresh Game
        </button>

    </div>

</section>


<!-- Called numbers -->
<section class="card">

    <h3>Called Numbers</h3>

    <div
        id="calledNumbers"
        class="called-list"
    >
        No numbers called yet.
    </div>

</section>


<!-- Footer -->
<footer class="footer">
    Good Bingo Game • 75 Ball Bingo
</footer>

</div><!-- Good Bingo Game JavaScript --><script src="/static/app.js"></script></body>
</html>
