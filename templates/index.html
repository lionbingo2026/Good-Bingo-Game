<!DOCTYPE html>
<html>
<head>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <title>Good Bingo Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .card {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 5px;
            justify-content: center;
            margin: 20px auto;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
        }

        .free {
            background: #ddd;
        }

        .called {
            margin: 20px;
            font-size: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
        }

    </style>

</head>

<body>

<h1>🎲 Good Bingo Game</h1>

<h2>Your Bingo Card</h2>

<div class="card">

    <div class="cell">1</div>
    <div class="cell">16</div>
    <div class="cell">31</div>
    <div class="cell">46</div>
    <div class="cell">61</div>

    <div class="cell">5</div>
    <div class="cell">20</div>
    <div class="cell">35</div>
    <div class="cell">50</div>
    <div class="cell">70</div>

    <div class="cell">8</div>
    <div class="cell">24</div>
    <div class="cell free">FREE</div>
    <div class="cell">53</div>
    <div class="cell">72</div>

    <div class="cell">12</div>
    <div class="cell">27</div>
    <div class="cell">40</div>
    <div class="cell">57</div>
    <div class="cell">75</div>

    <div class="cell">14</div>
    <div class="cell">29</div>
    <div class="cell">44</div>
    <div class="cell">59</div>
    <div class="cell">68</div>

</div>


<div class="called">
    🔢 Called Number:
    <span id="number">--</span>
</div>


<button onclick="joinGame()">Join Game</button>

<p id="status"></p>


<script>

const tg = window.Telegram.WebApp;

tg.ready();


function joinGame(){

    let user_id = "test_user";


    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {

        user_id = tg.initDataUnsafe.user.id;

    }


    fetch("/api/join", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            user_id: user_id

        })

    })


    .then(response => response.json())


    .then(data => {

        document.getElementById("status").innerHTML =
        data.message;

    })


    .catch(error => {

        document.getElementById("status").innerHTML =
        "Join error";

        console.log(error);

    });


}


</script>


</body>
</html>
