<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no"><title>Good Bingo Game</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f5f5f5;
    }

    .game {
        max-width: 500px;
        margin: auto;
    }

    h1 {
        margin-bottom: 10px;
    }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
    }

    #status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        background: white;
    }

    .bingo-board {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin-top: 25px;
    }

    .cell {
        padding: 15px 5px;
        background: white;
        border-radius: 6px;
        font-weight: bold;
    }

    .free {
        background: #ddd;
    }
</style>

</head><body><div class="game"><h1>🎲 Good Bingo Game</h1>

<p>Welcome to the Bingo Mini App!</p>

<button onclick="joinGame()">
    🎟️ Join Game
</button>

<div id="status">
    Ready to join.
</div>

<div class="bingo-board" id="bingoBoard"></div>

</div><script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


function joinGame() {

    let user_id = "test_user";

    if (tg.initDataUnsafe &&
        tg.initDataUnsafe.user) {

        user_id = tg.initDataUnsafe.user.id;
    }

    document.getElementById("status").innerText =
        "Joining game...";

    fetch("/api/join", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            user_id: user_id
        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("status").innerText =
            data.message || "Joined successfully!";

    })

    .catch(error => {

        document.getElementById("status").innerText =
            "Join error";

        console.error(error);

    });
}


function createBoard() {

    const board =
        document.getElementById("bingoBoard");

    board.innerHTML = "";

    for (let i = 1; i <= 25; i++) {

        const cell =
            document.createElement("div");

        cell.className = "cell";

        if (i === 13) {

            cell.innerText = "FREE";
            cell.classList.add("free");

        } else {

            cell.innerText = i;
        }

        board.appendChild(cell);
    }
}

createBoard();

</script></body>
</html>
