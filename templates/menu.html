<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Bingo Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .menu {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: #eef2f7;
            color: #172033;
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
        }

        .play-button {
            background: #172033;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="menu">

        <h1>🎮 Good Bingo Menu</h1>

        <a class="menu-button" href="/">
            🏠 Start
        </a>

        <a class="menu-button" href="/profile">
            👤 Registration / Profile
        </a>

        <a class="menu-button" href="/phone">
            📱 Phone Number
        </a>

        <a class="menu-button" href="/wallet">
            💰 Wallet / Balance
        </a>

        <a class="menu-button" href="/deposit">
            ➕ Deposit
        </a>

        <a class="menu-button" href="/withdrawal">
            💸 Withdrawal
        </a>

        <a class="menu-button" href="/cards">
            🎫 My Cards
        </a>

        <a class="menu-button play-button" href="/game">
            🎯 Play Bingo
        </a>

        <a class="menu-button" href="/winners">
            🏆 Winners
        </a>

        <a class="menu-button" href="/transactions">
            📜 Transactions
        </a>

        <a class="menu-button" href="/help">
            ℹ️ Help
        </a>

    </div>

</div>

</body>
</html>
