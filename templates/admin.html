<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Bingo Game Admin</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container">

    <h1>🔐 Admin Dashboard</h1>

    <h2>Good Bingo Game Control</h2>

    <div class="admin-box">

        <p>Game Status:</p>
        <p id="status">
            Waiting...
        </p>

        <button>
            Start Game
        </button>

        <button>
            Stop Game
        </button>

    </div>


    <h2>Players</h2>

    <div id="players">
        No players yet.
    </div>


    <h2>Wallet Management</h2>

    <p>
        Admin can approve deposits,
        manage balances, and view users.
    </p>

</div>


<script src="/static/js/app.js"></script>

</body>
</html>
